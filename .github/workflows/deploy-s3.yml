name: Deploy to S3 and Invalidate CloudFront

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test AWS credentials
        run: |
          echo "Testing AWS credentials..."
          aws sts get-caller-identity
          echo "Testing S3 access..."
          aws s3 ls s3://${{ secrets.S3_BUCKET_NAME }}/dist/ || echo "⚠️ Warning: Cannot list bucket contents"
          echo "Testing CloudFront access..."
          aws cloudfront get-distribution --id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --query 'Distribution.Id' --output text || echo "⚠️ Warning: Cannot access CloudFront distribution"

      - name: Upload to S3 (sync)
        run: |
          echo "Uploading files to S3 (dist folder)..."
          aws s3 sync ./frontend/dist s3://${{ secrets.S3_BUCKET_NAME }}/dist \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"
          
          echo "Uploading HTML files..."
          aws s3 cp ./frontend/dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/dist/index.html \
            --content-type "text/html" \
            --cache-control "public, max-age=0, must-revalidate"
          
          echo "✅ All files uploaded successfully to s3://${{ secrets.S3_BUCKET_NAME }}/dist/"

      - name: Create CloudFront invalidation
        run: |
          echo "Creating CloudFront invalidation..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          
          if [ -z "$INVALIDATION_ID" ]; then
            echo "❌ Error: Failed to create invalidation"
            exit 1
          fi
          
          echo "✅ Invalidation created successfully!"
          echo "   ID: $INVALIDATION_ID"
          echo "   Paths: /*"
          echo ""
          echo "⏳ Invalidation is processing. This may take 1-5 minutes to complete."
          echo "   Your site will update automatically once the invalidation finishes."
          echo "   Check status: https://console.aws.amazon.com/cloudfront/v3/home#/distributions/${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}/invalidations"

      - name: Deployment summary
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment completed successfully!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 S3 Bucket: ${{ secrets.S3_BUCKET_NAME }}/dist/"
          echo "🌐 CloudFront Distribution: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "📄 Files deployed with proper cache headers"
          echo ""
          echo "💡 Note: CloudFront invalidation may take 1-5 minutes to complete."
          echo "   Your site will update automatically once the invalidation finishes."


name: Deploy to S3 and Invalidate CloudFront

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test AWS credentials
        run: |
          echo "Testing AWS credentials..."
          aws sts get-caller-identity
          echo "Testing S3 access..."
          aws s3 ls s3://${{ secrets.S3_BUCKET_NAME }}/ || echo "⚠️ Warning: Cannot list bucket contents"
          echo "Testing CloudFront access..."
          aws cloudfront get-distribution --id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --query 'Distribution.Id' --output text || echo "⚠️ Warning: Cannot access CloudFront distribution"

      - name: Upload to S3 (sync)
        run: |
          aws s3 sync ./frontend/dist s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --exclude "index.html"

      - name: Create CloudFront invalidation
        run: |
          echo "Creating CloudFront invalidation..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "✅ Invalidation created: $INVALIDATION_ID" 
        continue-on-error: true

      - name: Deployment summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "📦 Files uploaded to S3 bucket: ${{ secrets.S3_BUCKET_NAME }}"
          echo "🔄 CloudFront invalidation created for distribution: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "📄 index.html renamed to index2.html"

